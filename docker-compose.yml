services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sneakertown
      POSTGRES_USER: sneakertown
      POSTGRES_PASSWORD: sneakertown
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneakertown -d sneakertown"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sneakertown:sneakertown@db:5432/sneakertown
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-production}
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
